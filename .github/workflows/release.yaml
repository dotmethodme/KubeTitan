name: Release

# One flow, on every merge to main: check it, work out the version, build it for
# every platform we ship, tag it, publish it.
#
# - Pull requests run the checks only.
# - A push to main runs the checks, then reads the conventional-commit messages
#   since the last tag to decide the next version, builds that version, and
#   publishes a GitHub release with the archives attached and notes grouped by
#   commit type.
# - Nothing to release (only chores, docs or CI since the last tag) means no tag:
#   a release for every README typo is noise.
#
# The version bump is committed back with `[skip ci]`, which is what stops the
# push from starting this workflow again.
#
# Platforms: Linux x86_64 and macOS arm64. Windows is deliberately absent:
# `config.rs` falls back to `$HOME/.config`, which Windows does not set, so the
# app would write its state into the working directory. Fix that first.
#
# Third-party actions are pinned to a commit SHA with the release it came from
# in a trailing comment. A tag is a mutable pointer that can be repointed at
# other code, so `@v7` is both a supply-chain hole and a silent upgrade; the
# comment is what makes the SHA readable. To move a pin: bump the SHA, the
# comment and the tag it names in the same line.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# never cancel a run that is half-way through publishing a release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries for egui/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libwayland-dev pkg-config

      - name: Rust toolchain
        # dtolnay/rust-toolchain has no release tags: `@stable` is a branch head,
        # so the pin is a commit on master and the toolchain is named explicitly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  version:
    needs: check
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      bump: ${{ steps.next.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the version and the notes come from the history since the last tag
          fetch-depth: 0

      - name: Work out the next version
        id: next
        run: |
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "current version: $current"
          python3 .github/scripts/next-release.py --current "$current" --notes notes.md | tee out.txt
          echo "version=$(sed -n 's/^version=//p' out.txt)" >> "$GITHUB_OUTPUT"
          echo "bump=$(sed -n 's/^bump=//p' out.txt)" >> "$GITHUB_OUTPUT"
          echo "--- notes ---"; cat notes.md

      - name: Keep the notes for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  # One job per platform, in parallel, only when there is something to release.
  build:
    needs: version
    if: needs.version.outputs.version != ''
    timeout-minutes: 45
    strategy:
      # a mac failure should not cancel the linux one: both results matter
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
            # plain `macos-15` is the arm64 image (`macos-15-intel` is x64), and
            # macos-14 was retired on 2026-11-02: pinning a version beats
            # `macos-latest`, which only moves after a brownout-free migration
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries for egui/winit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libwayland-dev pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-30
        with:
          toolchain: stable

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          # separate cache per platform, or the mac and linux artifacts fight
          key: ${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # the tag is the source of truth for the version, so the binary agrees
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/kubetitan dist/kubetitan
          cp LICENSE README.md dist/
          # -f names the archive inside dist/ explicitly: with `-C dist -f …` the
          # archive lands wherever tar opens it, which is not worth guessing
          tar -C dist -czf "dist/kubetitan-${{ matrix.platform }}.tar.gz" kubetitan LICENSE README.md
          rm -f dist/kubetitan dist/LICENSE dist/README.md
          ls -l dist

      - name: Keep the archive for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubetitan-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # every platform's job, flattened into one directory
          pattern: kubetitan-*
          path: dist
          merge-multiple: true

      - name: Collect the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Checksums
        run: |
          cd dist
          ls -l
          # one checksum file for all platforms, made here so there is one copy
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Commit the version bump
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "KubeTitan Release"
          git config user.email "release@kubetitan.com"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          git add Cargo.toml Cargo.lock
          # [skip ci] keeps this push from starting the workflow again
          git commit -m "chore(release): v$VERSION [skip ci]" || echo "nothing to commit"
          git push

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, uploading/replacing assets"
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
              --title "KubeTitan $tag" \
              --notes-file notes.md \
              --target "$(git rev-parse HEAD)"
          fi
          echo "released $tag"
