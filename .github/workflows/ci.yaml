name: CI

# Fast checks on everything, and nothing that ships.
#
# There is no release build here on purpose. `[profile.release]` sets
# `lto = "thin"` and `codegen-units = 1`, which is the right trade for a binary
# people download and the wrong one for a pull request: one codegen unit means no
# parallel codegen, and the linked binary alone took over 13 minutes on the first
# cold run, on top of the same dependencies being compiled a third time. A release
# build belongs in the release workflow, which runs on a tag and can afford to be
# slow.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System libraries for egui/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libwayland-dev pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # pull requests read the cache, they do not each write one
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --check --all

      # clippy and test are separate steps so a failure names the culprit; they
      # share one dependency build anyway
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # after `cargo test` this costs seconds, and it catches a binary that does
      # not link
      - name: Build
        run: cargo build --locked
